# logstash.conf
# Cấu hình Logstash nhận log từ Spring Boot (StoreX) qua TCP và đẩy sang Elasticsearch

input {
  tcp {
    port => 5000
    # Sử dụng codec json_lines để parse các log event được gửi qua TCP theo từng dòng JSON (newline-delimited JSON)
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
  }
}
